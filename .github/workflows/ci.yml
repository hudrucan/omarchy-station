name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatting and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@v5

      - name: Check Zig formatting
        run: mise exec -- zig fmt --check build.zig build.zig.zon src

      - name: Check shell syntax
        run: |
          for script in \
            install-omarchy \
            plugin/build.sh \
            packaging/omastation/PKGBUILD \
            packaging/omastation/install-login \
            packaging/omastation/omastation-session-start \
            packaging/omastation/omastation-session-launch \
            packaging/omastation/omastation-login-recover \
            packaging/omastation/omastation-recover; do
            bash -n "$script"
          done

      - name: Check desktop-start contracts
        run: python3 tests/login_start.py
