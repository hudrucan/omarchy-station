name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and check (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git mise python hyprland jq
          pkgconf openssl pam libva libdrm mesa libxkbcommon opus libfdk-aac gsm fuse3 libpipewire

      - uses: actions/checkout@v4

      - name: Restore toolchain and build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise/installs/zig
            ~/.cache/zig
            ~/.cache/omastation/build
          key: ${{ runner.os }}-omastation-${{ hashFiles('mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-omastation-${{ hashFiles('mise.toml') }}-

      - name: Set up the pinned toolchain
        run: |
          mise trust
          mise install

      - name: Build, check formatting and run unit/integration tests
        run: make check JOBS=2

      - name: Benchmark builds and runs
        run: make bench JOBS=2
